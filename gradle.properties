gtnh.modules.gitVersion = false

# GTNH Gradle settings
gtnh.settings.blowdryerTag =

# Mod metadata
modName = Microphone Text Input
modId = mcmti
modGroup = io.github.jaffe2718.mcmti
useModGroupForPublishing = false
autoUpdateBuildScript = false

# Minecraft / Forge
minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/
developmentEnvironmentUserName = Developer

# Java
enableModernJavaSyntax = false
enableGenericInjection = false

# Generated token class
generateGradleTokenClass = io.github.jaffe2718.mcmti.Tags
gradleTokenVersion = VERSION
gradleTokenModId =
gradleTokenModName =
gradleTokenGroupName =
replaceGradleTokenInFile =

# API / mixins / coremod
apiPackage =
accessTransformersFile =
usesMixins = false
separateMixinSourceSet =
usesMixinDebug = false
mixinPlugin =
mixinsPackage =
coreModClass =
containsMixinsAndOrCoreModOnly = false
forceEnableMixins = false

# Shadowing (Vosk + JNA are bundled into the mod jar)
usesShadowedDependencies = true
minimizeShadowedDependencies = false
relocateShadowedDependencies = false

# Repositories / publishing
includeWellKnownRepositories = true
excludeWellKnownRepositories =
usesMavenPublishing = false
mavenPublishUrl =
modrinthProjectId =
modrinthRelations =
curseForgeProjectId =
curseForgeRelations =

# Build hygiene: the style repositories are not needed to compile the mod.
disableSpotless = true
disableCheckstyle = true
org.gradle.configuration-cache = false
org.gradle.parallel = true
org.gradle.jvmargs = -Xmx3G -Dfile.encoding=UTF-8
