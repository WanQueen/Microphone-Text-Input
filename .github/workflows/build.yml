name: Build

on:
    workflow_dispatch:
    push:
        branches:
            - Forge-1.7.10
    pull_request:
        branches:
            - Forge-1.7.10

jobs:
    build:
        name: Build 1.7.10 jar
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            # GTNHGradle 2.0.24 is compiled for Java 25 (class file version
            # 69), so Gradle itself must run on a JDK 25. Compiling the mod
            # still targets Java 8 bytecode (enableModernJavaSyntax = false).
            -   name: Setup JDK 25
                uses: actions/setup-java@v5
                with:
                    java-version: '25'
                    distribution: 'temurin'

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v4

            -   name: Grant execute permission for gradlew
                run: chmod +x gradlew

            -   name: Build
                run: ./gradlew build --no-daemon

            -   name: Upload jar
                uses: actions/upload-artifact@v4
                with:
                    name: mcmti-1.7.10
                    path: build/libs/mcmti-*.jar
                    if-no-files-found: error
